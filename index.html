    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when some libraries try to polyfill or wrap fetch in environments where it is read-only.
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { console.warn('Blocked attempt to override window.fetch'); },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // If we can't redefine it, we just hope the library that tries to set it has its own try-catch
        }
      })();
    </script>
